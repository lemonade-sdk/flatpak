app-id: ai.lemonade_server.Lemonade
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
separate-locales: false
command: lemonade-supervisor
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node24

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  # we use x11 instead of fallback-x11; tauri/arboard requires Wayland data-control protocols
  # mutter does not support these protocols yet
  - --socket=x11
  - --socket=pulseaudio
  # --device=dri can't expose /dev/accel/accel0, /dev/kfd (Flatpak < 1.8)
  - --device=all
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-run/lemonade:rw
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1
  - --env=LEMONADE_DISABLE_SYSTEMD_JOURNAL=1

build-options:
  strip: true
  no-debuginfo: true

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/man
  # we do this here for any bundled extensions
  - /extensions/backends/*/include
  - /extensions/backends/*/lib/pkgconfig
  - /extensions/backends/*/lib/cmake
  - /extensions/backends/*/share/man
  - '*.a'
  - '*.la'

cleanup-commands:
  - install -d ${FLATPAK_DEST}/extensions/backends
  - install -d ${FLATPAK_DEST}/extensions/backends/fastflowlm

add-extensions:
  ai.lemonade_server.Lemonade.backends:
    directory: extensions/backends
    subdirectories: true
    no-autodownload: true
    autodelete: true
  ai.lemonade_server.Lemonade.backends.fastflowlm:
    versions: stable;beta
    directory: extensions/backends/fastflowlm
    bundle: false
    no-autodownload: true
    autodelete: true
    download-if: have-kernel-module-amdxdna
    enable-if: have-kernel-module-amdxdna

modules:
  - modules/nlohmann-json.json
  - modules/cli11.json
  - modules/cpp-httplib.json
  - modules/libwebsockets.json
  - modules/mbedtls.json
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  - name: lemonade-cpp
    buildsystem: cmake-ninja
    builddir: true
    no-make-install: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_PREFIX_PATH=/app
      - -DREQUIRE_LINUX_TRAY=ON
      - -DBUILD_TAURI_APP=OFF
      - -DUSE_SYSTEM_NODEJS_MODULES=OFF
    post-install:
      - install -Dm755 lemond      /app/bin/lemond
      - install -Dm755 lemonade    /app/bin/lemonade
      - install -Dm755 lemonade-tray /app/bin/lemonade-tray
      - install -d /app/share/lemonade-server/resources
      - cp -r resources/. /app/share/lemonade-server/resources/
      - install -Dm644 resources/defaults.json /app/share/lemonade/defaults.json
      - ln -sf ../share/lemonade-server/resources /app/bin/resources
    sources:
      - &lemonade-source
        type: git
        url: https://github.com/lemonade-sdk/lemonade.git
        tag: v10.10.0
        commit: 8929d7063098e036af4cf5e80350ba7e69b68aff
        disable-lfs: true
      - type: patch
        path: 0001-fix-app-store-settings-under-user-config-dir.patch

  - name: lemonade-app
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node24/bin:/usr/lib/sdk/rust-stable/bin
      env:
        HOME: /run/build/lemonade-app
        XDG_CACHE_HOME: /run/build/lemonade-app/flatpak-node/cache
        NPM_CONFIG_CACHE: /run/build/lemonade-app/flatpak-node/npm-cache
        NPM_CONFIG_OFFLINE: "true"
        NPM_CONFIG_NODEDIR: /usr/lib/sdk/node24
    build-commands:
      - cd src/app && npm install --offline
      - cd src/app && npm run build:renderer:prod
      - mkdir -p .cargo
      - printf "[source.crates-io]\nreplace-with = \"vendored-sources\"\n\n[source.vendored-sources]\ndirectory = \"/run/build/lemonade-app/cargo/vendor\"\n" > .cargo/config.toml
      - cd src/app/src-tauri && cargo build --release --offline --features tauri/custom-protocol
      - install -Dm755 src/app/src-tauri/target/release/lemonade-app /app/bin/lemonade-app
    sources:
      - *lemonade-source
      - type: patch
        path: 0001-fix-app-store-settings-under-user-config-dir.patch
      - type: patch
        path: 0002-flatpak-tauri-identifier-matches-flatpak-app-id.patch
      - generated-node-sources.json
      - generated-cargo-sources.json

  - name: lemonade-supervisor
    buildsystem: simple
    build-commands:
      - install -Dm755 lemonade-supervisor.sh /app/bin/lemonade-supervisor
    sources:
      - type: file
        path: lemonade-supervisor.sh

  - name: metadata
    buildsystem: simple
    build-commands:
      - install -Dm644 ai.lemonade_server.Lemonade.appdata.xml /app/share/metainfo/ai.lemonade_server.Lemonade.metainfo.xml
      - install -Dm644 data/lemonade-app.desktop /app/share/applications/ai.lemonade_server.Lemonade.desktop
      - desktop-file-edit --set-name="Lemonade" --set-icon=ai.lemonade_server.Lemonade --set-key=Exec --set-value="lemonade-supervisor %u" --add-mime-type=x-scheme-handler/lemonade /app/share/applications/ai.lemonade_server.Lemonade.desktop
      - install -Dm644 src/app/assets/logo.svg /app/share/icons/hicolor/scalable/apps/ai.lemonade_server.Lemonade.svg
      - install -Dm644 src/app/src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/ai.lemonade_server.Lemonade.png
      - install -Dm644 src/app/src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/ai.lemonade_server.Lemonade.png
    sources:
      - type: file
        path: ai.lemonade_server.Lemonade.appdata.xml
      - *lemonade-source
