name: Build Flatpak

on:
  workflow_call:
    inputs:
      dry-run:
        description: "Dry run mode. Build and verify everything, but skip pushing to the registry and publishing the site."
        required: false
        type: boolean
        default: false
    secrets:
      gpg-private-key:
        description: "Optional GPG private key for signing flatpak repository metadata."
        required: false
    outputs:
      pages-url:
        description: "Public URL of the flatpak repository landing page."
        value: ${{ jobs.build.outputs.pages-url }}

jobs:
  build:
    name: "Build and Deploy"
    uses: aetherpak/actions/.github/workflows/publish.yml@v3
    with:
      manifest-path: ai.lemonade_server.Lemonade/ai.lemonade_server.Lemonade.yaml
      branch: stable
      run-linter: true
      index-template: .github/workflows/templates/lemonade.html
      arches: x86_64
      upload-bundle: true
      dry-run: ${{ inputs.dry-run }}
    secrets:
      gpg-private-key: ${{ secrets.gpg-private-key }}
